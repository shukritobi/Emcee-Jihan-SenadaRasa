<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" role="img" aria-labelledby="title desc">
  <title id="title">Certificate of Completion — Sutra Jiwa</title>
  <desc id="desc">Sijil tamat Magis Pengacara Workshop 2025 untuk Muhamad Azam Najihan bin Jamaluddin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#731824"/><stop offset="1" stop-color="#8e2732"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f8d68a" stop-opacity=".9"/><stop offset="1" stop-color="#d09a32" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="960" height="672" rx="28" fill="url(#bg)"/>
  <circle cx="85" cy="65" r="165" fill="url(#glow)" opacity=".35"/>
  <circle cx="885" cy="610" r="190" fill="url(#glow)" opacity=".34"/>
  <rect x="65" y="58" width="830" height="556" rx="2" fill="none" stroke="#e4c16b" stroke-width="3"/>
  <path d="M65 145h830M65 532h830" stroke="#e4c16b" stroke-width="1" opacity=".55"/>
  <g fill="#f5dfac" text-anchor="middle" font-family="Georgia,serif">
    <text x="480" y="126" font-size="26" letter-spacing="8">SUTRA JIWA</text>
    <text x="480" y="225" font-size="60" letter-spacing="6">CERTIFICATE</text>
    <text x="480" y="273" font-size="24" letter-spacing="10">OF COMPLETION</text>
    <text x="480" y="342" font-size="17" font-family="Arial,sans-serif">This certificate is proudly presented to</text>
    <text x="480" y="410" font-size="34">MUHAMAD AZAM NAJIHAN BIN JAMALUDDIN</text>
    <text x="480" y="458" font-size="17" font-family="Arial,sans-serif">for completing the course of Magis Pengacara Workshop 2025</text>
    <text x="480" y="488" font-size="17" font-family="Arial,sans-serif">by Sutra Jiwa</text>
    <text x="480" y="571" font-size="16" font-family="Arial,sans-serif" letter-spacing="3">OFFICIALLY TRAINED EMCEE</text>
  </g>
  <g fill="none" stroke="#e4c16b" opacity=".7">
    <circle cx="145" cy="555" r="28" stroke-width="4"/><circle cx="145" cy="555" r="18"/><path d="M145 514v82M104 555h82"/>
  </g>
</svg>